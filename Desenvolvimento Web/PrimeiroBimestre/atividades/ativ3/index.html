<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Minha To-Do List</h1>
    </header>

    <section>
      <form class="formulario" onsubmit="adicionar(event)">
        <label for="tarefa">Nova tarefa</label>
        <div class="campos">
          <input type="text" id="tarefa" name="tarefa" placeholder="Digite uma nova tarefa...">
          <button type="submit">Adicionar</button>
        </div>
      </form>

      <ul id="lista"></ul>
    </section>

    <footer>
      <p>Clique em uma tarefa para removê-la.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
