<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>
    <fieldset>
        <legend>Registre-se</legend>
    <h3>Informe os seus dados para realizar o cadastro na plataforma.</h3>
    <form action="/url-api-back-end" method="post">

        <br>
        <label for="nome">Informe seu nome 🪪 : </label>
        <input type="text" id="nome" name="nome" placeholder="Nome" required maxlength="10"
            pattern="[A-Za-z ]+" minlength="5"/>
        <br>

        <br>
        <label for="email">Informe seu e-mail 📧 : </label>
        <input type="email" id="email" name="email" placeholder="E-mail" required />
        <br>

        <br>
        <label for="senha">Informe sua senha 🔑 : </label>
        <input type="password" id="senha" name="senha" placeholder="Senha" required minlength="6" maxlength="10" />
        <br>
        <br>

        <label for="bio">Insira sua biografia 📖 :  </label>
        <br>
        <textarea name="bio" id="bio" placeholder="Insira sua bio..." rows="6" cols="26" style="resize: none;"></textarea>
        
        <br>
        <label for="time"> Selecione o melhor time do BR :</label>
        <br>
        <select name="Melhor-time" id="time">
        <br>
            
            <option value="" selected disabled>Selecione</option>
            
            <optgroup label="Sem Mundial">
            <option value="Palmeiras">Palmeiras </option>
            </optgroup>

            <optgroup label="Peixão">
            <option value="Flamengo">Santos </option>
            </optgroup>

            <optgroup label="Tricolor">
            <option value="time">São Paulo </option>
            </optgroup>  
            
            <optgroup label="Galinha Preta">
            <option value="time">Corinthians </option>
            </optgroup>   

        </select>

        <br>
        <br>
        <input type="submit" value="Enviar">
    </form>
    
    </fieldset>

</body>

</html>
